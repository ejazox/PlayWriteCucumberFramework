name: Playwright-Cucumber Docker CI

on:
  push:
    branches: [main]
  pull_request: 

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t my-playwright-cucumber .

      - name: Run tests inside Docker container
        run: docker run --rm my-playwright-cucumber
